[package]
name = "vbaword-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
calamine = "0.37.0"
clap = { version = "4.6", features = ["derive"] }
roxmltree = "0.21.1"
rust_xlsxwriter = "0.101"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
toml = "1.1"
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }
